<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unknown Pleasures — Generator SVG</title>

    <style>
        /* ============================================================
           RESET — usuwamy domyślne marginesy i paddingi przeglądarki
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================================
           BODY — układ dwukolumnowy: sidebar po lewej, podgląd po prawej
           ============================================================ */
        body {
            display: flex;              /* Flexbox ustawia elementy obok siebie */
            height: 100vh;             /* Pełna wysokość okna przeglądarki */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;       /* Ciemnoszare tło */
            color: #e0e0e0;            /* Jasnoszary tekst */
        }

        /* ============================================================
           SIDEBAR — panel boczny z kontrolkami (lewa strona)
           ============================================================ */
        #sidebar {
            width: 320px;              /* Stała szerokość panelu */
            min-width: 320px;          /* Nie pozwalamy się skurczyć */
            height: 100vh;            /* Pełna wysokość */
            overflow-y: auto;          /* Scroll jeśli kontrolek jest dużo */
            background: #252525;       /* Nieco jaśniejsze tło niż reszta */
            padding: 20px;
            border-right: 1px solid #333;  /* Subtelna linia oddzielająca */
        }

        #sidebar h1 {
            font-size: 1.4em;
            margin-bottom: 4px;
            color: #ffffff;
        }

        #sidebar > p {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 24px;
        }

        /* ============================================================
           PRZYCISKI — "Generuj" i "Eksportuj SVG"
           ============================================================ */
        .buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #4a9eff;       /* Niebieski — główny przycisk */
            color: #fff;
        }

        .btn-primary:hover {
            background: #3a8eef;
        }

        .btn-secondary {
            background: #3a3a3a;       /* Szary — przycisk drugorzędny */
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #4a4a4a;
        }

        /* ============================================================
           SEKCJE KONTROLEK — grupy ustawień z nagłówkiem
           ============================================================ */
        .control-section {
            margin-bottom: 20px;
        }

        .control-section h2 {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #333;
        }

        /* ============================================================
           POJEDYNCZA KONTROLKA — etykieta + slider/input + wartość
           ============================================================ */
        .control {
            margin-bottom: 12px;
        }

        .control label {
            display: flex;
            justify-content: space-between;  /* Nazwa po lewej, wartość po prawej */
            font-size: 0.85em;
            margin-bottom: 4px;
            color: #ccc;
        }

        .control label span.value {
            color: #4a9eff;            /* Niebieska wartość liczbowa */
            font-weight: 600;
        }

        /* Slider (input type="range") */
        .control input[type="range"] {
            width: 100%;
            accent-color: #4a9eff;     /* Kolor suwaka */
        }

        /* Dropdown (select) */
        .control select {
            width: 100%;
            padding: 6px 8px;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 0.85em;
        }

        /* Pole tekstowe (input type="text" / "number") */
        .control input[type="text"],
        .control input[type="number"] {
            width: 100%;
            padding: 6px 8px;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 0.85em;
        }

        /* ============================================================
           PREVIEW — obszar podglądu grafiki (prawa strona)
           ============================================================ */
        #preview {
            flex: 1;                   /* Zajmuje całą pozostałą szerokość */
            display: flex;
            align-items: center;       /* Centruje grafikę w pionie */
            justify-content: center;   /* Centruje grafikę w poziomie */
            padding: 40px;
            overflow: auto;            /* Scroll jeśli grafika jest większa */
            background: #1a1a1a;
        }

        /* Kontener na SVG w podglądzie */
        #preview svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);  /* Cień pod grafiką */
        }
    </style>
</head>
<body>

    <!-- ==================== PANEL BOCZNY (SIDEBAR) ==================== -->
    <!-- Tutaj będą wszystkie kontrolki do sterowania wyglądem grafiki -->
    <aside id="sidebar">
        <h1>Unknown Pleasures</h1>
        <p>Generator SVG</p>

        <!-- Przyciski akcji -->
        <div class="buttons">
            <button class="btn btn-primary" id="btnGenerate">Generuj</button>
            <button class="btn btn-secondary" id="btnExport">Eksportuj SVG</button>
        </div>

        <!-- ========== SEKCJA: Właściwości linii ========== -->
        <div class="control-section">
            <h2>Linie</h2>

            <!-- Ilość kresek -->
            <div class="control">
                <label>Ilość linii <span class="value" id="valLineCount">40</span></label>
                <input type="range" id="ctrlLineCount" min="5" max="80" value="40" step="1">
            </div>

            <!-- Wariancja (wysokość szczytu) -->
            <div class="control">
                <label>Wariancja (mm) <span class="value" id="valVariance">20</span></label>
                <input type="range" id="ctrlVariance" min="1" max="50" value="20" step="0.5">
            </div>

            <!-- Grubość kreski -->
            <div class="control">
                <label>Grubość kreski (mm) <span class="value" id="valStrokeWidth">0.4</span></label>
                <input type="range" id="ctrlStrokeWidth" min="0.1" max="3" value="0.4" step="0.1">
            </div>

            <!-- Odstępy między liniami -->
            <div class="control">
                <label>Odstępy (mm) <span class="value" id="valSpacing">4</span></label>
                <input type="range" id="ctrlSpacing" min="1" max="20" value="4" step="0.5">
            </div>
        </div>

        <!-- ========== SEKCJA: Rozmiar strony ========== -->
        <div class="control-section">
            <h2>Strona</h2>

            <!-- Rozmiar strony — predefiniowane formaty -->
            <div class="control">
                <label>Format</label>
                <select id="ctrlPageSize">
                    <option value="A4" selected>A4 (210 × 297 mm)</option>
                    <option value="A3">A3 (297 × 420 mm)</option>
                    <option value="A2">A2 (420 × 594 mm)</option>
                    <option value="A1">A1 (594 × 841 mm)</option>
                    <option value="A0">A0 (841 × 1189 mm)</option>
                    <option value="custom">Własny rozmiar</option>
                </select>
            </div>

            <!-- Pola na własny rozmiar (ukryte domyślnie) -->
            <div class="control" id="customSizeGroup" style="display: none;">
                <label>Szerokość (mm)</label>
                <input type="number" id="ctrlCustomWidth" value="210" min="50" max="2000">
                <label style="margin-top: 6px;">Wysokość (mm)</label>
                <input type="number" id="ctrlCustomHeight" value="297" min="50" max="2000">
            </div>

            <!-- Orientacja -->
            <div class="control">
                <label>Orientacja</label>
                <select id="ctrlOrientation">
                    <option value="portrait" selected>Pionowa (portret)</option>
                    <option value="landscape">Pozioma (krajobraz)</option>
                </select>
            </div>
        </div>

        <!-- ========== SEKCJA: Kształt fali ========== -->
        <div class="control-section">
            <h2>Kształt fali</h2>

            <!-- Szerokość szczytu (sigma Gaussowska) -->
            <div class="control">
                <label>Szerokość szczytu <span class="value" id="valSigma">0.14</span></label>
                <input type="range" id="ctrlSigma" min="0.05" max="0.5" value="0.14" step="0.01">
            </div>

            <!-- Wygładzanie -->
            <div class="control">
                <label>Wygładzanie <span class="value" id="valSmoothing">3</span></label>
                <input type="range" id="ctrlSmoothing" min="0" max="10" value="3" step="1">
            </div>

            <!-- Gęstość próbkowania -->
            <div class="control">
                <label>Gęstość punktów <span class="value" id="valDensity">250</span></label>
                <input type="range" id="ctrlDensity" min="50" max="500" value="250" step="10">
            </div>
        </div>

        <!-- ========== SEKCJA: Marginesy ========== -->
        <div class="control-section">
            <h2>Marginesy</h2>

            <div class="control">
                <label>Lewy (mm) <span class="value" id="valMarginLeft">40</span></label>
                <input type="range" id="ctrlMarginLeft" min="0" max="100" value="40" step="1">
            </div>

            <div class="control">
                <label>Prawy (mm) <span class="value" id="valMarginRight">40</span></label>
                <input type="range" id="ctrlMarginRight" min="0" max="100" value="40" step="1">
            </div>

            <div class="control">
                <label>Górny (mm) <span class="value" id="valMarginTop">50</span></label>
                <input type="range" id="ctrlMarginTop" min="0" max="100" value="50" step="1">
            </div>

            <div class="control">
                <label>Dolny (mm) <span class="value" id="valMarginBottom">50</span></label>
                <input type="range" id="ctrlMarginBottom" min="0" max="100" value="50" step="1">
            </div>
        </div>

        <!-- ========== SEKCJA: Losowość i kolory ========== -->
        <div class="control-section">
            <h2>Inne</h2>

            <!-- Seed (ziarno losowości) -->
            <div class="control">
                <label>Seed (ziarno)</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="ctrlSeed" placeholder="losowy" style="flex: 1;">
                    <button class="btn btn-secondary" id="btnRandomSeed" style="flex: 0; padding: 6px 10px; font-size: 0.8em;">🎲</button>
                </div>
            </div>

            <!-- Inwersja kolorów -->
            <div class="control">
                <label>
                    <input type="checkbox" id="ctrlInverted" style="width: auto; margin-right: 6px;">
                    Odwróć kolory (białe tło)
                </label>
            </div>
        </div>

    </aside>

    <!-- ==================== OBSZAR PODGLĄDU ==================== -->
    <!-- Tutaj wyświetlamy wygenerowaną grafikę SVG -->
    <main id="preview">
        <!-- SVG zostanie wstawione tutaj przez JavaScript -->
    </main>

    <script>
        // ================================================================
        // KONFIGURACJA DOMYŚLNA
        // Wszystkie wartości liczbowe są w milimetrach (mm),
        // ponieważ chcemy generować grafiki gotowe do druku.
        // ================================================================
        const CONFIG = {
            lineCount: 40,         // Ile linii (fal) rysujemy
            variance: 20,          // Jak bardzo linia odchyla się od poziomu (mm)
            strokeWidth: 0.4,      // Grubość kreski (mm)
            spacing: 4,            // Odstęp pionowy między liniami (mm)
            sigma: 0.14,           // Szerokość szczytu Gaussowskiego (0-1)
            smoothingPasses: 3,    // Ile razy wygładzamy falę
            sampleDensity: 250,    // Ile punktów pomiarowych na jedną linię
            marginLeft: 40,        // Margines lewy (mm)
            marginRight: 40,       // Margines prawy (mm)
            marginTop: 50,         // Margines górny (mm)
            marginBottom: 50,      // Margines dolny (mm)
            pageWidth: 210,        // Szerokość strony w mm (A4 domyślnie)
            pageHeight: 297,       // Wysokość strony w mm (A4 domyślnie)
            inverted: false,       // false = białe linie na czarnym tle
            seed: null,            // Ziarno losowości (null = losowe)
        };


        // ================================================================
        // GENERATOR LICZB PSEUDOLOSOWYCH (Seeded PRNG)
        // ----------------------------------------------------------------
        // Używamy algorytmu "mulberry32". Dzięki temu, podając to samo
        // "ziarno" (seed), zawsze dostaniemy identyczną sekwencję liczb.
        // To pozwala odtwarzać dokładnie ten sam wzór grafiki.
        //
        // Jak działa: przyjmuje liczbę całkowitą (seed) i zwraca FUNKCJĘ,
        // która za każdym wywołaniem daje kolejną liczbę z zakresu [0, 1).
        // ================================================================
        function createRandom(seed) {
            // Konwertujemy seed na liczbę 32-bitową
            let s = seed | 0;
            return function () {
                // Algorytm mulberry32 — seria operacji bitowych
                s = (s + 0x6D2B79F5) | 0;
                let t = Math.imul(s ^ (s >>> 15), 1 | s);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                // Wynik dzielimy przez 2^32 żeby dostać liczbę 0..1
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }


        // ================================================================
        // GENEROWANIE POJEDYNCZEJ FALI (jednej linii)
        // ----------------------------------------------------------------
        // Każda linia to tablica punktów [x, y].
        //
        // Kluczowa idea: szczyty (góry) są skupione w CENTRUM linii,
        // a na brzegach linia jest płaska. Osiągamy to za pomocą
        // "kopuły Gaussowskiej" (Gaussian envelope) — funkcji dzwonowej,
        // która ma wartość 1 w centrum i spada do ~0 na bokach.
        //
        // Parametry:
        //   numPoints — ile punktów ma linia
        //   variance  — maksymalna wysokość szczytu (mm)
        //   sigma     — szerokość "kopuły" (0.1 = wąska, 0.3 = szeroka)
        //   random    — funkcja losowa (nasz seeded PRNG)
        // ================================================================
        function generateWaveform(numPoints, variance, sigma, random) {
            // Krok 1: Generujemy surowe odchylenia dla każdego punktu
            const rawOffsets = [];
            for (let i = 0; i < numPoints; i++) {
                // Pozycja znormalizowana: 0 = lewy brzeg, 1 = prawy brzeg
                const t = i / (numPoints - 1);

                // Kopuła Gaussowska — wartość bliska 1 w centrum (t=0.5),
                // bliska 0 na brzegach (t=0 i t=1)
                const exponent = -Math.pow(t - 0.5, 2) / (2 * sigma * sigma);
                const envelope = Math.exp(exponent);

                // Losowe odchylenie: wartość od -variance do +variance,
                // przemnożona przez kopułę (więc na brzegach jest ~0)
                const noise = (random() * 2 - 1) * variance * envelope;

                rawOffsets.push(noise);
            }

            // Krok 2: Wygładzanie — uśredniamy każdy punkt z sąsiadami
            return smoothArray(rawOffsets);
        }


        // ================================================================
        // WYGŁADZANIE TABLICY WARTOŚCI (Moving Average)
        // ----------------------------------------------------------------
        // Prosta technika: zastępujemy każdą wartość średnią z niej samej
        // i jej dwóch sąsiadów. Powtarzamy to kilka razy.
        // Efekt: zamiast poszarpanych linii dostajemy płynne, organiczne fale.
        //
        // Parametry:
        //   arr   — tablica liczb do wygładzenia
        //   passes — ile razy powtarzamy wygładzanie (domyślnie z CONFIG)
        // ================================================================
        function smoothArray(arr, passes) {
            passes = passes !== undefined ? passes : CONFIG.smoothingPasses;
            let result = arr.slice(); // Kopia tablicy (żeby nie zmieniać oryginału)

            for (let pass = 0; pass < passes; pass++) {
                const smoothed = [];
                for (let i = 0; i < result.length; i++) {
                    if (i === 0 || i === result.length - 1) {
                        // Brzegowe punkty zostawiamy bez zmian
                        smoothed.push(result[i]);
                    } else {
                        // Średnia z lewego sąsiada, punktu i prawego sąsiada
                        const avg = (result[i - 1] + result[i] + result[i + 1]) / 3;
                        smoothed.push(avg);
                    }
                }
                result = smoothed;
            }

            return result;
        }


        // ================================================================
        // TWORZENIE ELEMENTU SVG
        // ----------------------------------------------------------------
        // Funkcja pomocnicza do tworzenia elementów SVG.
        // SVG wymaga specjalnej "przestrzeni nazw" (namespace),
        // dlatego nie możemy użyć zwykłego document.createElement().
        // ================================================================
        const SVG_NS = 'http://www.w3.org/2000/svg';

        function createSVGElement(tag, attributes) {
            const el = document.createElementNS(SVG_NS, tag);
            // Ustawiamy wszystkie podane atrybuty
            for (const [key, value] of Object.entries(attributes || {})) {
                el.setAttribute(key, value);
            }
            return el;
        }


        // ================================================================
        // GŁÓWNA FUNKCJA — GENEROWANIE CAŁEJ GRAFIKI
        // ----------------------------------------------------------------
        // Tworzy kompletny element SVG z wszystkimi liniami (falami).
        //
        // Kluczowy trik wizualny — EFEKT NAKŁADANIA:
        // Dla każdej linii rysujemy DWA elementy:
        //   1. Wypełniony czarny kształt (fala + dół) — MASKUJE linie za nią
        //   2. Biały obrys fali — to co faktycznie WIDZIMY
        //
        // Dzięki temu szczyty dolnych linii "wychodzą" przed liniami powyżej,
        // ale są zasłaniane przez linie poniżej — dokładnie jak na okładce
        // albumu "Unknown Pleasures".
        //
        // Linie rysujemy OD GÓRY DO DOŁU, ponieważ w SVG elementy narysowane
        // później są wyświetlane NA WIERZCHU (jak warstwy w Photoshopie).
        // ================================================================
        function generateVisualization() {
            // Przygotowanie ziarna losowości
            const seed = CONFIG.seed !== null
                ? CONFIG.seed
                : Math.floor(Math.random() * 2147483647);
            CONFIG.seed = seed;

            const random = createRandom(seed);

            // Wymiary strony i marginesy
            const pageW = CONFIG.pageWidth;
            const pageH = CONFIG.pageHeight;

            // Obszar rysowania (strona minus marginesy)
            const drawLeft = CONFIG.marginLeft;
            const drawRight = pageW - CONFIG.marginRight;
            const drawWidth = drawRight - drawLeft;

            // Obliczamy, ile miejsca zajmą wszystkie linie razem
            const totalLinesHeight = (CONFIG.lineCount - 1) * CONFIG.spacing;

            // Centrujemy blok linii w pionie (z uwzględnieniem marginesów)
            const availableHeight = pageH - CONFIG.marginTop - CONFIG.marginBottom;
            const startY = CONFIG.marginTop + (availableHeight - totalLinesHeight) / 2;

            // Kolory — normalne lub odwrócone
            const bgColor = CONFIG.inverted ? '#ffffff' : '#000000';
            const lineColor = CONFIG.inverted ? '#000000' : '#ffffff';

            // Tworzymy element SVG z odpowiednimi wymiarami
            const svg = createSVGElement('svg', {
                'xmlns': SVG_NS,
                'width': pageW + 'mm',
                'height': pageH + 'mm',
                'viewBox': '0 0 ' + pageW + ' ' + pageH,
            });

            // Tło — czarny (lub biały) prostokąt wypełniający całą stronę
            const bg = createSVGElement('rect', {
                'x': '0',
                'y': '0',
                'width': pageW,
                'height': pageH,
                'fill': bgColor,
            });
            svg.appendChild(bg);

            // Rysujemy każdą linię od góry do dołu
            for (let lineIndex = 0; lineIndex < CONFIG.lineCount; lineIndex++) {
                // Pozycja bazowa (Y) tej linii
                const baselineY = startY + lineIndex * CONFIG.spacing;

                // Generujemy falę — tablicę odchyleń od poziomu
                const offsets = generateWaveform(
                    CONFIG.sampleDensity,
                    CONFIG.variance,
                    CONFIG.sigma,
                    random
                );

                // Budujemy ścieżkę SVG (path) z punktów fali
                // Format ścieżki SVG: "M x,y L x,y L x,y ..."
                //   M = Move to (przesuń do punktu startowego)
                //   L = Line to (narysuj linię do kolejnego punktu)
                let wavePath = '';
                const points = []; // Zapamiętujemy punkty do maski

                for (let i = 0; i < offsets.length; i++) {
                    // Pozycja X — równomiernie rozłożona w obszarze rysowania
                    const x = drawLeft + (i / (offsets.length - 1)) * drawWidth;
                    // Pozycja Y — linia bazowa MINUS odchylenie
                    // (minus, bo w SVG oś Y rośnie W DÓŁ)
                    const y = baselineY - offsets[i];

                    points.push({ x, y });

                    if (i === 0) {
                        wavePath += 'M ' + x.toFixed(2) + ',' + y.toFixed(2);
                    } else {
                        wavePath += ' L ' + x.toFixed(2) + ',' + y.toFixed(2);
                    }
                }

                // --- ELEMENT 1: Maska (wypełniony kształt) ---
                // Zamykamy kształt: od ostatniego punktu fali schodzimy w dół
                // do linii bazowej, idziemy w lewo do początku, i zamykamy (Z).
                // Wypełniamy kolorem tła — to maskuje linie narysowane wcześniej.
                const maskPath = wavePath
                    + ' L ' + points[points.length - 1].x.toFixed(2) + ',' + (baselineY + CONFIG.variance).toFixed(2)
                    + ' L ' + points[0].x.toFixed(2) + ',' + (baselineY + CONFIG.variance).toFixed(2)
                    + ' Z';

                const mask = createSVGElement('path', {
                    'd': maskPath,
                    'fill': bgColor,
                    'stroke': 'none',
                });
                svg.appendChild(mask);

                // --- ELEMENT 2: Widoczna linia (obrys fali) ---
                const line = createSVGElement('path', {
                    'd': wavePath,
                    'fill': 'none',
                    'stroke': lineColor,
                    'stroke-width': CONFIG.strokeWidth,
                    'stroke-linejoin': 'round',
                    'stroke-linecap': 'round',
                });
                svg.appendChild(line);
            }

            return svg;
        }


        // ================================================================
        // WYŚWIETLANIE GRAFIKI W PODGLĄDZIE
        // ================================================================
        function renderPreview() {
            const preview = document.getElementById('preview');
            // Usuwamy poprzednią grafikę
            preview.innerHTML = '';
            // Generujemy nową i wstawiamy do strony
            const svg = generateVisualization();
            preview.appendChild(svg);
        }


        // ================================================================
        // PREDEFINIOWANE ROZMIARY STRON (szerokość × wysokość w mm)
        // ================================================================
        const PAGE_SIZES = {
            'A4': { w: 210, h: 297 },
            'A3': { w: 297, h: 420 },
            'A2': { w: 420, h: 594 },
            'A1': { w: 594, h: 841 },
            'A0': { w: 841, h: 1189 },
        };


        // ================================================================
        // DEBOUNCE — opóźnia wywołanie funkcji
        // ----------------------------------------------------------------
        // Gdy użytkownik szybko przesuwa suwak, nie chcemy przerysowywać
        // grafiki na KAŻDĄ zmianę (byłoby za wolno). Debounce czeka
        // aż użytkownik przestanie ruszać suwakiem na zadany czas (ms),
        // i dopiero wtedy wywołuje funkcję.
        // ================================================================
        function debounce(fn, delay) {
            let timer = null;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(fn, delay);
            };
        }

        // Opóźniony render — czeka 50ms po ostatniej zmianie suwaka
        const debouncedRender = debounce(function () {
            renderPreview();
        }, 50);


        // ================================================================
        // PODPINANIE KONTROLEK DO KONFIGURACJI
        // ----------------------------------------------------------------
        // Każdy slider/input aktualizuje odpowiednie pole w CONFIG
        // i wyświetla aktualną wartość obok etykiety.
        // ================================================================

        // Funkcja pomocnicza: podpina slider do pola CONFIG
        function bindSlider(inputId, valueId, configKey, parser) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(valueId);
            input.addEventListener('input', function () {
                const value = parser ? parser(input.value) : parseFloat(input.value);
                CONFIG[configKey] = value;
                display.textContent = input.value;
                debouncedRender();
            });
        }

        // --- Podpinamy wszystkie slidery ---
        bindSlider('ctrlLineCount', 'valLineCount', 'lineCount', parseInt);
        bindSlider('ctrlVariance', 'valVariance', 'variance');
        bindSlider('ctrlStrokeWidth', 'valStrokeWidth', 'strokeWidth');
        bindSlider('ctrlSpacing', 'valSpacing', 'spacing');
        bindSlider('ctrlSigma', 'valSigma', 'sigma');
        bindSlider('ctrlSmoothing', 'valSmoothing', 'smoothingPasses', parseInt);
        bindSlider('ctrlDensity', 'valDensity', 'sampleDensity', parseInt);
        bindSlider('ctrlMarginLeft', 'valMarginLeft', 'marginLeft', parseInt);
        bindSlider('ctrlMarginRight', 'valMarginRight', 'marginRight', parseInt);
        bindSlider('ctrlMarginTop', 'valMarginTop', 'marginTop', parseInt);
        bindSlider('ctrlMarginBottom', 'valMarginBottom', 'marginBottom', parseInt);


        // ================================================================
        // OBSŁUGA ROZMIARU STRONY
        // ================================================================

        document.getElementById('ctrlPageSize').addEventListener('change', function () {
            const value = this.value;
            const customGroup = document.getElementById('customSizeGroup');

            if (value === 'custom') {
                // Pokazujemy pola na własny rozmiar
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
                // Ustawiamy wymiary z predefiniowanej tabeli
                const size = PAGE_SIZES[value];
                applyPageSize(size.w, size.h);
            }
        });

        // Pola na własny rozmiar
        document.getElementById('ctrlCustomWidth').addEventListener('change', function () {
            CONFIG.pageWidth = parseInt(this.value) || 210;
            applyOrientation();
            debouncedRender();
        });

        document.getElementById('ctrlCustomHeight').addEventListener('change', function () {
            CONFIG.pageHeight = parseInt(this.value) || 297;
            applyOrientation();
            debouncedRender();
        });

        // Orientacja (portret / krajobraz)
        document.getElementById('ctrlOrientation').addEventListener('change', function () {
            applyOrientation();
            debouncedRender();
        });

        // Ustawia rozmiar strony z uwzględnieniem orientacji
        function applyPageSize(w, h) {
            const orientation = document.getElementById('ctrlOrientation').value;
            if (orientation === 'landscape') {
                CONFIG.pageWidth = Math.max(w, h);
                CONFIG.pageHeight = Math.min(w, h);
            } else {
                CONFIG.pageWidth = Math.min(w, h);
                CONFIG.pageHeight = Math.max(w, h);
            }
            debouncedRender();
        }

        // Przelicza orientację na aktualnym rozmiarze
        function applyOrientation() {
            const orientation = document.getElementById('ctrlOrientation').value;
            const w = CONFIG.pageWidth;
            const h = CONFIG.pageHeight;
            if (orientation === 'landscape') {
                CONFIG.pageWidth = Math.max(w, h);
                CONFIG.pageHeight = Math.min(w, h);
            } else {
                CONFIG.pageWidth = Math.min(w, h);
                CONFIG.pageHeight = Math.max(w, h);
            }
        }


        // ================================================================
        // OBSŁUGA SEEDA (ZIARNA LOSOWOŚCI)
        // ================================================================

        // Konwertuje tekst na liczbę (prosty hash)
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash | 0; // Konwersja do 32-bitowej liczby
            }
            return Math.abs(hash);
        }

        document.getElementById('ctrlSeed').addEventListener('change', function () {
            const val = this.value.trim();
            if (val === '') {
                CONFIG.seed = null; // Pusty = losowy
            } else {
                // Jeśli wpisano liczbę, użyj jej; jeśli tekst, zahashuj
                CONFIG.seed = isNaN(val) ? hashString(val) : parseInt(val);
            }
            renderPreview();
        });

        // Przycisk losowego seeda
        document.getElementById('btnRandomSeed').addEventListener('click', function () {
            CONFIG.seed = null;
            document.getElementById('ctrlSeed').value = '';
            renderPreview();
        });


        // ================================================================
        // INWERSJA KOLORÓW
        // ================================================================
        document.getElementById('ctrlInverted').addEventListener('change', function () {
            CONFIG.inverted = this.checked;
            renderPreview();
        });


        // ================================================================
        // OBSŁUGA PRZYCISKÓW
        // ================================================================

        // Przycisk "Generuj" — generuje nowy losowy wzór
        document.getElementById('btnGenerate').addEventListener('click', function () {
            CONFIG.seed = null;
            document.getElementById('ctrlSeed').value = '';
            renderPreview();
        });


        // ================================================================
        // EKSPORT SVG
        // ----------------------------------------------------------------
        // Serializujemy element SVG do tekstu XML, tworzymy z niego plik
        // (Blob) i pobieramy go jako plik .svg.
        // ================================================================
        document.getElementById('btnExport').addEventListener('click', function () {
            // Generujemy SVG (bez zmian seeda — eksportujemy aktualny wzór)
            const svg = generateVisualization();

            // Serializujemy DOM SVG do tekstu XML
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(svg);

            // Dodajemy deklarację XML na początku pliku
            svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgString;

            // Tworzymy "plik" w pamięci przeglądarki (Blob)
            const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });

            // Tworzymy tymczasowy link do pobrania i klikamy go
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'unknown-pleasures.svg';
            document.body.appendChild(link);
            link.click();

            // Sprzątamy
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });


        // ================================================================
        // AKTUALIZACJA WYŚWIETLACZA SEEDA
        // ----------------------------------------------------------------
        // Po wyrenderowaniu grafiki, pokazujemy aktualny seed w polu
        // tekstowym (żeby użytkownik mógł go skopiować i odtworzyć wzór).
        // ================================================================
        const originalRenderPreview = renderPreview;
        renderPreview = function () {
            originalRenderPreview();
            // Jeśli pole seed jest puste, pokaż wygenerowany seed
            const seedInput = document.getElementById('ctrlSeed');
            if (seedInput.value === '' && CONFIG.seed !== null) {
                seedInput.placeholder = CONFIG.seed;
            }
        };


        // Na start — generujemy pierwszą grafikę
        renderPreview();
    </script>

</body>
</html>
